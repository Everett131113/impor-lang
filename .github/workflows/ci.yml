# Impor (I++) CI 工作流（v3.11.0）
#
# 平台边界（如实声明，不静默跳过）：
#   - Windows：完整套件（单元测试 / 模糊测试 / conformance / 基准）。
#   - Linux：解释器冒烟（run 多个示例 + 格式 / 静态检查 + 语法零警告）。
#     C 后端依赖随包的 win32 tcc.exe，Linux 当前不提供 CLI 编译；
#     Linux 的 C ABI 由 c-abi-x64.yml 的 gcc 格单独验证。
#
# 用法：把本文件放到仓库 .github/workflows/ci.yml 即可。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 测试 (${{ matrix.os }} / py${{ matrix.python-version }} / ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
            suite: full
          - os: windows-latest
            python-version: "3.12"
            suite: full
          - os: ubuntu-latest
            python-version: "3.11"
            suite: smoke
          - os: ubuntu-latest
            python-version: "3.12"
            suite: smoke
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 编译零警告检查
        run: python -W error::SyntaxWarning -m compileall -f -q impor examples tests benchmarks Impor.py

      - name: 运行时体检（v5.6）
        run: python Impor.py doctor

      - name: 解释器冒烟（Linux 平台边界内）
        if: matrix.suite == 'smoke'
        run: |
          python Impor.py run examples/hello.impor
          python Impor.py run examples/demo_12_bubble_sort.impor
          python Impor.py run examples/demo_21_word_frequency.impor
          python Impor.py run examples/demo_30_closures.impor

      - name: 单元测试
        if: matrix.suite == 'full'
        run: python run_tests.py

      - name: 三后端一致性（conformance）
        if: matrix.suite == 'full'
        run: python conformance/run_conformance.py --ci

      - name: 模糊测试（快速）
        if: matrix.suite == 'full'
        env:
          IMPOR_FUZZ_ITERS: "60"
        run: python -m unittest tests.test_fuzz

      - name: 格式检查
        run: python Impor.py check-fmt examples/snake.impor

      - name: 静态检查
        run: python Impor.py lint examples/snake.impor

      - name: 性能基准（快速）
        if: matrix.suite == 'full'
        run: python benchmarks/bench_impor.py --quick --json bench.json

      - name: 上传基准报告
        if: matrix.suite == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: bench.json
