# Impor C ABI 六格矩阵门禁
#
# 目的：把 --c-source 的“未实测”变成可复现的 CI 证据。
#   win32  ：内置 tcc 编 32 位 DLL，校验 PE Machine=0x14c 与四个导出符号
#   win64  ：MSVC (cl /LD) 编 64 位 DLL，校验 PE Machine=0x8664 与四个导出符号
#   linux64：gcc -shared -m64 编 .so，校验 ELF x86-64 与四个导出符号
#   linux-arm64：aarch64 交叉编译 .so，校验 ELF AArch64 与四个导出符号
#   macos-arm64 / macos-x64：见 c-abi-macos.yml（手动触发）。
#     当前账号的 macOS runner 分钟数不可用，push 触发会排队后被取消；
#     因此不把 macOS 两格挂在 push 门禁上，避免 badge 长期红。
#
# 不依赖本机工具链；每次 push / PR 自动跑 Windows/Linux 四格。
name: C ABI matrix

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  msvc-x64:
    name: MSVC x64 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 启用 MSVC 开发者环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 用 cl /LD 编 64 位 DLL
        run: |
          cd out
          cmd /c build_msvc.bat

      - name: 校验 PE 位宽与导出符号
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("out/ci_lib.dll")
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Host ("PE Machine = 0x{0:x4}" -f $machine)
          if ($machine -ne 0x8664) { throw "不是 x64 PE：Machine=0x$($machine.ToString('x4'))" }

          $exports = dumpbin /exports out/ci_lib.dll
          $missing = @()
          foreach ($s in @("impor_add", "impor_sub", "impor_mul", "impor_greet")) {
            if (-not ($exports -match "\b$s\b")) { $missing += $s }
          }
          if ($missing.Count -gt 0) { throw "缺少导出符号：$($missing -join ', ')" }
          Write-Host "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"

  gcc-x64:
    name: GCC x64 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 用 gcc -shared -m64 编 64 位 .so
        run: gcc -shared -fPIC -m64 -O2 out/ci_lib.c -o out/libci_lib.so -lm -ldl

      - name: 校验 ELF 位宽与导出符号
        run: |
          file out/libci_lib.so
          file out/libci_lib.so | grep -q 'x86-64'
          for s in impor_add impor_sub impor_mul impor_greet; do
            nm -D --defined-only out/libci_lib.so | grep -Eq " T $s$"
          done
          echo "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"

  linux64-runtime:
    name: Linux x64 产物 + 三种宿主实跑 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: --target linux64 生成 .so（examples/cabi_demo/logic.impor）
        run: python Impor.py build examples/cabi_demo/logic.impor --lib --c-source -o out/linux --target linux64

      - name: 校验 ELF 位宽与导出符号
        run: |
          file out/linux/liblogic.so
          readelf -h out/linux/liblogic.so | grep -q 'X86-64'
          for s in impor_add impor_fib impor_greet impor_free_str impor_runtime_shutdown; do
            nm -D --defined-only out/linux/liblogic.so | grep -Eq " T $s$"
          done
          echo "导出符号齐全：impor_add / impor_fib / impor_greet / impor_free_str / impor_runtime_shutdown"

      - name: C 宿主（链接导入库直接调用，退出码必须为 0）
        run: |
          cd out/linux
          gcc -O2 -I. ../../examples/cabi_demo/host_c.c -L. -llogic -o host_c
          LD_LIBRARY_PATH=. ./host_c
          echo "C 宿主退出码：$?"

      - name: C 宿主（dlopen → 调用 → dlclose → 退出，退出码必须为 0）
        run: |
          cd out/linux
          gcc -O2 ../../examples/cabi_demo/host_c_dyn.c -o host_c_dyn -ldl
          LD_LIBRARY_PATH=. ./host_c_dyn ./liblogic.so
          echo "C 动态宿主退出码：$?"

      - name: Python 宿主（ctypes）
        run: |
          cd out/linux
          python ../../examples/cabi_demo/host_python.py ./liblogic.so
          echo "Python 宿主退出码：$?"

  win32:
    name: TCC win32 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 用内置 tcc 编 32 位 DLL
        shell: pwsh
        run: |
          .\impor\tcc\win32\tcc.exe -shared out\ci_lib.c -o out\ci_lib.dll

      - name: 校验 PE 位宽
        run: python tools/check_artifact.py --expect win32 out/ci_lib.dll

      - name: 启用 MSVC 开发者环境（仅取 dumpbin）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 校验导出符号
        shell: pwsh
        run: |
          $exports = dumpbin /exports out/ci_lib.dll
          $missing = @()
          foreach ($s in @("impor_add", "impor_sub", "impor_mul", "impor_greet")) {
            if (-not ($exports -match "\b$s\b")) { $missing += $s }
          }
          if ($missing.Count -gt 0) { throw "缺少导出符号：$($missing -join ', ')" }
          Write-Host "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"

  linux-arm64:
    name: GCC linux-arm64 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 aarch64 交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 交叉编译 aarch64 .so
        run: aarch64-linux-gnu-gcc -shared -fPIC -O2 out/ci_lib.c -o out/libci_lib.so -lm

      - name: 校验 ELF 机器类型与导出符号
        run: |
          python tools/check_artifact.py --expect linux-arm64 out/libci_lib.so
          readelf -h out/libci_lib.so | grep -q 'AArch64'
          for s in impor_add impor_sub impor_mul impor_greet; do
            aarch64-linux-gnu-nm -D --defined-only out/libci_lib.so | grep -Eq " T $s$"
          done
          echo "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"


