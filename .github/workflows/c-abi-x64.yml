# Impor C ABI 六格矩阵门禁
#
# 目的：把 --c-source 的“未实测”变成可复现的 CI 证据。
#   win32  ：内置 tcc 编 32 位 DLL，校验 PE Machine=0x14c 与四个导出符号
#   win64  ：MSVC (cl /LD) 编 64 位 DLL，校验 PE Machine=0x8664 与四个导出符号
#   linux64：gcc -shared -m64 编 .so，校验 ELF x86-64 与四个导出符号
#   linux-arm64：aarch64 交叉编译 .so，校验 ELF AArch64 与四个导出符号
#   macos-arm64 / macos-x64：clang 编 dylib，校验 Mach-O cputype 与四个导出符号
#
# 不依赖本机工具链；每次 push / PR 自动跑。
name: C ABI matrix

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  msvc-x64:
    name: MSVC x64 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 启用 MSVC 开发者环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 用 cl /LD 编 64 位 DLL
        run: |
          cd out
          cmd /c build_msvc.bat

      - name: 校验 PE 位宽与导出符号
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("out/ci_lib.dll")
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Host ("PE Machine = 0x{0:x4}" -f $machine)
          if ($machine -ne 0x8664) { throw "不是 x64 PE：Machine=0x$($machine.ToString('x4'))" }

          $exports = dumpbin /exports out/ci_lib.dll
          $missing = @()
          foreach ($s in @("impor_add", "impor_sub", "impor_mul", "impor_greet")) {
            if (-not ($exports -match "\b$s\b")) { $missing += $s }
          }
          if ($missing.Count -gt 0) { throw "缺少导出符号：$($missing -join ', ')" }
          Write-Host "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"

  gcc-x64:
    name: GCC x64 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 用 gcc -shared -m64 编 64 位 .so
        run: gcc -shared -fPIC -m64 -O2 out/ci_lib.c -o out/libci_lib.so -lm -ldl

      - name: 校验 ELF 位宽与导出符号
        run: |
          file out/libci_lib.so
          file out/libci_lib.so | grep -q 'x86-64'
          for s in impor_add impor_sub impor_mul impor_greet; do
            nm -D --defined-only out/libci_lib.so | grep -Eq " T $s$"
          done
          echo "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"

  win32:
    name: TCC win32 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 用内置 tcc 编 32 位 DLL
        shell: pwsh
        run: |
          .\impor\tcc\win32\tcc.exe -shared out\ci_lib.c -o out\ci_lib.dll

      - name: 校验 PE 位宽
        run: python tools/check_artifact.py --expect win32 out/ci_lib.dll

      - name: 启用 MSVC 开发者环境（仅取 dumpbin）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 校验导出符号
        shell: pwsh
        run: |
          $exports = dumpbin /exports out/ci_lib.dll
          $missing = @()
          foreach ($s in @("impor_add", "impor_sub", "impor_mul", "impor_greet")) {
            if (-not ($exports -match "\b$s\b")) { $missing += $s }
          }
          if ($missing.Count -gt 0) { throw "缺少导出符号：$($missing -join ', ')" }
          Write-Host "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"

  linux-arm64:
    name: GCC linux-arm64 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 aarch64 交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 交叉编译 aarch64 .so
        run: aarch64-linux-gnu-gcc -shared -fPIC -O2 out/ci_lib.c -o out/libci_lib.so -lm

      - name: 校验 ELF 机器类型与导出符号
        run: |
          python tools/check_artifact.py --expect linux-arm64 out/libci_lib.so
          readelf -h out/libci_lib.so | grep -q 'AArch64'
          for s in impor_add impor_sub impor_mul impor_greet; do
            aarch64-linux-gnu-nm -D --defined-only out/libci_lib.so | grep -Eq " T $s$"
          done
          echo "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"

  macos-arm64:
    name: Clang macos-arm64 (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 用 clang 编 arm64 dylib
        run: clang -dynamiclib -O2 out/ci_lib.c -o out/libci_lib.dylib -lm

      - name: 校验 Mach-O 机器类型与导出符号
        run: |
          python tools/check_artifact.py --expect macos-arm64 out/libci_lib.dylib
          file out/libci_lib.dylib | grep -q 'arm64'
          for s in impor_add impor_sub impor_mul impor_greet; do
            nm -gU out/libci_lib.dylib | grep -Eq " _${s}$"
          done
          echo "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"

  macos-x64:
    name: Clang macos-x64 (macos-13)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 C 源码包
        run: python Impor.py build --lib --c-source examples/c_abi/ci_lib.impor -o out

      - name: 用 clang 编 x86_64 dylib
        run: clang -dynamiclib -O2 out/ci_lib.c -o out/libci_lib.dylib -lm

      - name: 校验 Mach-O 机器类型与导出符号
        run: |
          python tools/check_artifact.py --expect macos-x64 out/libci_lib.dylib
          file out/libci_lib.dylib | grep -q 'x86_64'
          for s in impor_add impor_sub impor_mul impor_greet; do
            nm -gU out/libci_lib.dylib | grep -Eq " _${s}$"
          done
          echo "导出符号齐全：impor_add / impor_sub / impor_mul / impor_greet"
