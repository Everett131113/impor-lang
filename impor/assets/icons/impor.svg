<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Impor (I++) 应用图标">
  <title>Impor (I++) 应用图标</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#131A28"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <ellipse cx="512" cy="512" rx="390" ry="390" fill="#7AA2F7" opacity="0.06"/>
  <rect x="5" y="5" width="1014" height="1014" rx="220" fill="none" stroke="#7AA2F7" stroke-opacity="0.42" stroke-width="2"/>

  <!-- I：衬线体骨架，缩到任务栏仍是一个稳定的竖标 -->
  <g fill="#F4F7FF">
    <rect x="265" y="250" width="100" height="524" rx="10"/>
    <rect x="225" y="250" width="180" height="58" rx="12"/>
    <rect x="225" y="716" width="180" height="58" rx="12"/>
  </g>

  <!-- ++：两枚加号，第一枚主蓝、第二枚浅蓝 -->
  <g fill="#7AA2F7">
    <rect x="450" y="478" width="170" height="68" rx="4"/>
    <rect x="501" y="427" width="68" height="170" rx="4"/>
  </g>
  <g fill="#A8C4FF">
    <rect x="675" y="478" width="170" height="68" rx="4"/>
    <rect x="726" y="427" width="68" height="170" rx="4"/>
  </g>
</svg>
